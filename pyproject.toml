[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galtext-extractor"
version = "1.1.0"
description = "从 galgame 游戏目录中提取对话文本（纯标准库、零运行时依赖），支持 KiriKiri XP3 / NScripter NSA-SAR / BGI arc / 散装脚本 / 通用二进制扫描，并导出 TXT、CSV、JSON 与剧本 PDF。"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "全部化掉了" }]
maintainers = [{ name = "全部化掉了" }]
keywords = [
    # 定位
    "galgame",
    "visual-novel",
    "text-extraction",
    # 引擎 / 封包格式 —— 这类工具主要靠「我玩的引擎有没有人做过」被搜到
    "kirikiri",
    "xp3",
    "nscripter",
    "onscripter",
    "bgi",
    "ethornell",
    # 用途
    "shift-jis",
    "translation",
    "localization",
    "fan-translation",
    # 技术栈
    "python",
    "tkinter",
    "pdf-generation",
    "cli",
    "zero-dependencies",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: MacOS X",
    "Environment :: Win32 (MS Windows)",
    "Environment :: X11 Applications",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: Japanese",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Graphics :: Viewers",
    "Topic :: Text Processing",
]
# 核心卖点：运行时只用标准库，这里必须保持为空。
dependencies = []

[project.optional-dependencies]
# 仅用于重新生成图标，运行程序本身不需要。
dev = ["pillow>=10.0"]
# 可选的 Fluent 风格 ttk 主题；装不上也能正常跑。
modern = ["sv-ttk>=2.6"]

[project.urls]
Homepage = "https://github.com/Huadiaole/galtext-extractor"
Repository = "https://github.com/Huadiaole/galtext-extractor"
Issues = "https://github.com/Huadiaole/galtext-extractor/issues"
"Bug Tracker" = "https://github.com/Huadiaole/galtext-extractor/issues"

[project.scripts]
galtext = "galtext.cli:main"

[project.gui-scripts]
galtext-gui = "galtext.gui:main"

[tool.setuptools]
packages = ["galtext", "galtext.parsers"]
include-package-data = true

[tool.setuptools.package-data]
# 图标分三层目录（app_*.png / app.ico 在 assets 根，工具栏图标在
# assets/icons/{light,dark,accent}/），三个 glob 缺一不可 ——
# 少写一条，装到系统里就会丢图标。
galtext = [
    "assets/*.png",
    "assets/*.ico",
    "assets/icons/*/*.png",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["sample_game", "_src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pyright]
include = ["galtext"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"
