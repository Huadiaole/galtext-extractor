name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 测试套件只用标准库，且从不在测试里创建 Tk 窗口，
# 所以不需要 xvfb-run 之类的虚拟显示。
jobs:
  test:
    name: 测试（${{ matrix.os }} / Python ${{ matrix.python-version }}）
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装 tkinter（仅 Linux）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk

      - name: 升级 pip
        run: python -m pip install --upgrade pip

      - name: 安装项目（不含可选依赖）
        run: pip install -e .

      - name: 跑测试
        run: python run_tests.py

      - name: 导入冒烟测试
        run: |
          python -c "import galtext, galtext.cli, galtext.gui, galtext.pipeline, galtext.fontkit, galtext.pdfgen, galtext.scriptpdf; import galtext.parsers; print('imports ok')"

  # 可选：只有在 Actions 页面手动触发（Run workflow）时才会打包 exe。
  # 想顺带支持定时构建的话，在 on: 里加上 schedule，并把下面的 if 改成
  # github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'。
  build-exe:
    name: 打包 exe（仅手动触发）
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    needs: test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装 PyInstaller
        run: python -m pip install --upgrade pip pyinstaller

      - name: 打包
        run: cmd /c build_exe.bat

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: GalTextExtractor-windows
          path: dist/GalTextExtractor.exe
          if-no-files-found: error
